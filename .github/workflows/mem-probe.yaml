# TEMPORARY diagnostic -- delete once the devel memory question is settled.
#
# Isolates why `ubuntu-latest (devel)` in R-CMD-check.yaml is SIGTERM'd during
# `checking tests` while `ubuntu-latest (release)` runs the same suite fine.
# Already ruled out by inspecting the R-CMD-check logs of 95d66ba: the two jobs
# resolve an IDENTICAL dependency stack (rxode2 5.1.6, nlmixr2est 7.0.2,
# RcppEigen 0.3.4.0.2, RcppParallel 6.2.0), so the difference is R itself.
#
# Probe A (cheap, no admixr2): does compiling/loading N rxode2 models leak native
#   memory, and at what rate per R version? Run twice per job -- with and without
#   MALLOC_ARENA_MAX=2 -- which tests the glibc-arena hypothesis directly.
# Probe B: the full per-file suite curve on both R versions from one commit.
#
# Push to a `ci/mem-probe**` branch to run it; nothing else triggers it.

on:
  push:
    branches: ['ci/mem-probe**']
  workflow_dispatch:

name: mem-probe

permissions: read-all

jobs:
  probe:
    runs-on: ubuntu-latest
    name: mem-probe (${{ matrix.r }})
    # Never let a probe fail the branch -- devel is EXPECTED to be killed here.
    continue-on-error: true
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        r: ['release', 'devel']

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Deliberately NOT set here -- Probe A sets it per invocation instead.
      # MALLOC_ARENA_MAX

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          http-user-agent: ${{ matrix.r == 'devel' && 'release' || 'default' }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 4
          extra-packages: any::testthat
          needs: check

      # Same failure mode the real workflow guards against; fail here, legibly,
      # rather than 20 minutes into a probe.
      - name: Confirm rxode2 loads
        run: library(rxode2)
        shell: Rscript {0}

      - name: Environment
        run: |
          uname -a
          ldd --version | head -1
          free -m
          nproc
          Rscript -e 'cat(R.version.string, "\n"); print(utils::packageVersion("rxode2")); print(utils::packageVersion("nlmixr2est"))'

      # Probe A -- twice, to test the arena hypothesis directly.
      - name: Probe A -- rxode2 model compile/load, default arenas
        run: Rscript .github/mem-probe/models.R default

      - name: Probe A -- rxode2 model compile/load, MALLOC_ARENA_MAX=2
        env:
          MALLOC_ARENA_MAX: "2"
        run: Rscript .github/mem-probe/models.R arena2

      # Probe C -- per-SOLVE vs per-MODEL. Probe A's ~1.7 MB/model cannot
      # explain multi-GB suite growth from ~57 distinct models, so the
      # candidate is rxSolve() on an already-compiled model.
      - name: Probe C -- repeated rxSolve on one model
        run: Rscript .github/mem-probe/solves.R default

      - name: Install admixr2
        run: |
          # src/ carries git-tracked WINDOWS build artifacts (admixr2.dll,
          # nll.o, RcppExports.o -- deliberately, see CLAUDE.md). make sees a
          # .o at least as new as its .cpp and links the COFF object, so a
          # direct source install on Linux dies with
          #   dangerous relocation: R_AMD64_IMAGEBASE with __ImageBase undefined
          # `R CMD build` strips src/*.o|so|dll into the tarball, which is why
          # the real check workflow never hits this and this probe did.
          rm -f src/*.o src/*.so src/*.dll
          R CMD INSTALL --no-multiarch --with-keep.source .

      # Probe D -- runs FIRST, because it is the one that localises the cause
      # and Probe B on devel is slow enough to hit the job cap before it.
      - name: Probe D -- what is retained on the heap
        run: Rscript .github/mem-probe/retain.R

      # Probe B -- devel is ~6x slower here and may hit the job cap partway.
      # The per-file rows are flushed as produced, so a partial curve survives.
      - name: Probe B -- full suite, per-file memory curve
        run: Rscript .github/mem-probe/suite.R
