on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: compat-oldstack

# Runs the FULL integration suite (NOT_CRAN=true) against the packages CRAN
# currently serves (public RSPM = current CRAN: rxode2 5.1.2 / nlmixr2est 6.0.1),
# NOT the r-universe pre-release (rxode2 5.1.3 / nlmixr2est 6.2.0). R-CMD-check
# and CRAN's own incoming check skip these tests (skip_on_cran), so this is the
# only signal that the sensitivity feature DEGRADES GRACEFULLY on the older stack
# -- e.g. a dosing modifier whose jump derivative 5.1.2 lacks must fall back to
# finite differences, not error. The jump-dependent tests are expected to SKIP
# here; nothing should FAIL.

permissions: read-all

jobs:
  integration-oldstack:
    runs-on: ubuntu-latest
    name: integration tests on current-CRAN stack

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # glibc arena retention across many rxode2 fits inflates RSS on ubuntu; cap
      # arenas so the heavy integration suite does not OOM (see the teardown fix).
      MALLOC_ARENA_MAX: "2"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true          # current CRAN, NOT r-universe

      # stringfish compiles against RcppParallel's TBB; a binary built against another
      # TBB generation fails to load and takes rxode2 -> the dependency install with it.
      # Install the binaries, check they load, rebuild from source only if they do not.
      # See R-CMD-check.yaml for the full account.
      - name: Ensure stringfish/qs2 load against the installed RcppParallel
        run: |
          install.packages("RcppParallel")
          install.packages(c("stringfish", "qs2"))
          if (!requireNamespace("qs2", quietly = TRUE)) {
            message("qs2 does not load -- rebuilding it and stringfish from source")
            install.packages(c("stringfish", "qs2"), type = "source")
          }
          library(qs2)
        shell: Rscript {0}

      # cache-version 3 evicts the libraries built during the RcppParallel 6 oneTBB break.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 3
          extra-packages: any::testthat
          needs: check                    # pulls Suggests (rxode2, nlmixr2, mirai, ...)

      # rxode2 links RcppParallel's TBB, so it must be loadable against whichever
      # RcppParallel the resolver installed -- and right now it is not, on Windows.
      # RcppParallel 6.2.0 (Windows binary 2026-08-01) moved Windows from a static
      # TBB to a shipped shared tbb.dll and removed the compatibility stub, while
      # CRAN still serves the rxode2 5.1.5 Windows binary built 2026-07-30 against
      # the previous generation, so rxode2.dll imports a procedure that no longer
      # exists. Each package is individually fine; only the COMBINATION is broken,
      # which is why a dated snapshot is the right shape of fix -- and a Windows
      # source build of rxode2 against 6.2.0 does not link (nlmixr2est hit that).
      #
      # DETECT and REPAIR are separate steps on purpose. Merely testing whether
      # rxode2 loads pulls RcppParallel's DLL into the session, and Windows will
      # not overwrite a loaded DLL -- doing both in one step fails with "cannot
      # remove prior installation of package 'RcppParallel'". Each `Rscript {0}`
      # step is a fresh R process, so the lock is gone by the time we install.
      #
      # Conditional, so it costs one requireNamespace() on a healthy platform and
      # removes itself once CRAN rebuilds the rxode2 binary -- same shape as the
      # stringfish/qs2 guard above. Delete both once they are no-ops everywhere.
      - name: Detect whether rxode2 loads against the installed RcppParallel
        run: |
          if (!requireNamespace("rxode2", quietly = TRUE))
            writeLines("pin", ".rxode2-needs-rcppparallel-pin")
        shell: Rscript {0}

      - name: Pin RcppParallel to a consistent snapshot if it does not
        run: |
          if (file.exists(".rxode2-needs-rcppparallel-pin")) {
            message("rxode2 does not load -- pinning RcppParallel to the snapshot ",
                    "its binary was built against")
            install.packages("RcppParallel",
                             repos = "https://packagemanager.posit.co/cran/2026-07-31")
            unlink(".rxode2-needs-rcppparallel-pin")
          }
        shell: Rscript {0}

      - name: Confirm rxode2 loads
        run: library(rxode2)   # fail here, with this message, not later and opaquely
        shell: Rscript {0}

      - name: Confirm this is the OLD (current-CRAN) stack
        run: |
          Rscript -e '
            rx <- as.character(packageVersion("rxode2"))
            ne <- as.character(packageVersion("nlmixr2est"))
            cat(sprintf("rxode2=%s  nlmixr2est=%s\n", rx, ne))
            if (utils::compareVersion(rx, "5.1.3") >= 0)
              cat("::warning::rxode2 >= 5.1.3 -- CRAN has caught up; this job now tests the NEW stack.\n")
          '
        shell: bash

      # Install (not load_all) so the mirai daemons in the parallel test load the
      # SAME admixr2 build the parent runs. devtools::load_all() would leave the
      # daemons on an absent/stale INSTALLED package -> workers silently diverge
      # from the sequential fit (the documented dev-mode parallel caveat).
      - name: Install admixr2
        run: |
          # Drop the git-tracked Windows build artifacts (src/*.o, *.dll): installing
          # from the working dir would otherwise LINK the stale Windows nll.o on Linux
          # ("dangerous relocation: R_AMD64_IMAGEBASE"). R CMD build cleans these when
          # it makes a tarball, which is why the full R-CMD-check is unaffected.
          rm -f src/*.o src/*.so src/*.dll
          R CMD INSTALL --no-multiarch --with-keep.source .
        shell: bash

      - name: Run integration suite with NOT_CRAN=true
        env:
          NOT_CRAN: "true"
        run: |
          Rscript -e '
            Sys.setenv(NOT_CRAN = "true")
            library(admixr2)
            res <- testthat::test_dir("tests/testthat", filter = "integration",
                                      reporter = "summary", stop_on_failure = FALSE)
            df  <- as.data.frame(res)
            failed  <- sum(df$failed)
            errored <- if ("error" %in% names(df)) sum(df$error) else 0
            skipped <- if ("skipped" %in% names(df)) sum(df$skipped) else
                       if ("skip" %in% names(df)) sum(df$skip) else 0
            passed  <- sum(df$passed)
            cat(sprintf("\nINTEGRATION (old stack): passed=%d failed=%d errored=%d skipped=%d\n",
                        passed, failed, errored, skipped))
            cat("Skips are expected (jump-dependent paths fall back to FD on 5.1.2).\n")
            if (failed > 0 || errored > 0) {
              cat("::error::integration tests FAILED/ERRORED on the current-CRAN stack\n")
              quit(status = 1)
            }
          '
        shell: bash
