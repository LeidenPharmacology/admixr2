on:
  push:
    tags: ['v*']
  workflow_dispatch:

name: pkgdown

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Backstop for the colour guard in vignettes/_common.R.  nlmixr2's fit
      # print method uses cli colour, and this runner reports as colour-capable,
      # so an article that forgets to source _common.R renders the escape codes
      # into the HTML -- pkgdown rewrites the ESC byte to U+2029, so the page
      # shows a stray "[1m" rather than anything recognisable.  Every article
      # sources the guard today; this makes forgetting it non-fatal.
      NO_COLOR: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build pkgdown site
        run: Rscript -e 'pkgdown::build_site(new_process = FALSE, install = FALSE)'

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs
          clean: true
