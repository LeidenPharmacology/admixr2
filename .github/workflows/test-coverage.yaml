on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: test-coverage

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Tier 2 integration tests guard on skip_on_cran(), which skips unless
      # NOT_CRAN == "true". Setting it here is NOT sufficient on its own:
      # covr::package_coverage() runs the test suite in a separate callr
      # session built from rcmd_safe_env(), which does not inherit this
      # job-level variable. tests/testthat/setup.R re-asserts NOT_CRAN inside
      # that session when R_COVR is set, which is what actually un-skips the
      # integration tier. This entry is kept as documentation / belt-and-braces.
      NOT_CRAN: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # stringfish compiles against RcppParallel's TBB; a binary built against another
      # TBB generation fails to load and takes rxode2 -> the dependency install with it.
      # Install the binaries, check they load, rebuild from source only if they do not.
      # See R-CMD-check.yaml for the full account.
      - name: Ensure stringfish/qs2 load against the installed RcppParallel
        run: |
          install.packages("RcppParallel")
          install.packages(c("stringfish", "qs2"))
          if (!requireNamespace("qs2", quietly = TRUE)) {
            message("qs2 does not load -- rebuilding it and stringfish from source")
            install.packages(c("stringfish", "qs2"), type = "source")
          }
          library(qs2)
        shell: Rscript {0}

      # cache-version 3 evicts the libraries built during the RcppParallel 6 oneTBB break.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 3
          extra-packages: any::covr, any::xml2
          needs: coverage

      # rxode2 links RcppParallel's TBB, so it must be loadable against whichever
      # RcppParallel the resolver installed -- and right now it is not, on Windows.
      # RcppParallel 6.2.0 (Windows binary 2026-08-01) moved Windows from a static
      # TBB to a shipped shared tbb.dll and removed the compatibility stub, while
      # CRAN still serves the rxode2 5.1.5 Windows binary built 2026-07-30 against
      # the previous generation. The result is
      #   unable to load shared object 'rxode2/libs/x64/rxode2.dll':
      #   LoadLibrary failure: The specified procedure could not be found.
      # i.e. an import that no longer exists. Each package is individually fine;
      # only the COMBINATION is broken, which is why a version snapshot is the
      # right shape of fix rather than a rebuild -- and a Windows source build of
      # rxode2 against 6.2.0 does not link (nlmixr2est hit exactly that).
      #
      # So: if rxode2 does not load, install RcppParallel from a dated snapshot
      # taken after the rxode2 binary was built and before 6.2.0 reached Windows.
      # Conditional rather than an unconditional pin -- it costs nothing on a
      # healthy platform and removes itself once CRAN rebuilds rxode2, exactly
      # like the stringfish/qs2 guard above. Delete both once they have been
      # no-ops everywhere for a while.
      - name: Ensure rxode2 loads against the installed RcppParallel
        run: |
          if (!requireNamespace("rxode2", quietly = TRUE)) {
            message("rxode2 does not load -- pinning RcppParallel to the snapshot ",
                    "its binary was built against")
            install.packages("RcppParallel",
                             repos = "https://packagemanager.posit.co/cran/2026-07-31")
            library(rxode2)  # fail here, with this message, not later and opaquely
          }
        shell: Rscript {0}

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
          file: ./cobertura.xml
          plugin: noop
          disable_search: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
