on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger. The dependency stack below us (RcppParallel/TBB -> stringfish ->
  # qs2 -> rxode2) has broken twice from CRAN-side rebuilds alone, with no commit of
  # ours involved, so being able to ask "does the current CRAN state still build?"
  # without pushing a dummy commit is worth the two lines. Pair it with a
  # cache-version bump when you want a genuinely cold resolve -- a warm cache is
  # what made macOS look healthy right through the RcppParallel 6.0.0 break.
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    continue-on-error: ${{ toJSON(matrix.config.continue-on-error) == 'true' }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release', continue-on-error: true}
          - {os: windows-latest, r: 'release'}
          - {os: macos-latest,   r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Belt-and-braces against malloc arena fragmentation. NOTE: profiling the
      # whole suite per file showed the devel job's growth is NATIVE memory that
      # accumulates in proportion to WORK DONE (models compiled/loaded per fit,
      # which rxode2 never returns) and is spread diffusely across ~19 files --
      # not one hot file and not the rxode2 model registry, both of which were
      # measured and ruled out. So this alone does not fix devel; the NOT_CRAN
      # scoping on the check step below is what does.
      MALLOC_ARENA_MAX: "2"


    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # stringfish compiles against RcppParallel's TBB, so a binary built against a
      # different TBB generation fails to LOAD. Loading rxode2 pulls in qs2 ->
      # stringfish -- DESCRIPTION Imports load with the namespace, verified -- so that
      # takes down the whole dependency install, hence a step BEFORE it. Dropping
      # admixr2's own qs2 Import does NOT avoid this; rxode2 imports qs2.
      #
      # RcppParallel 6.0.0 (2026-07-23) moved to oneTBB and removed tbb::internal,
      # which did exactly that. CRAN has since rebuilt the Windows binaries and P3M the
      # Linux ones, but NOT the macOS ones: it serves RcppParallel 6.1.1 beside a
      # stringfish built 2026-04-21.
      #
      # Rather than name the broken platform, install the binaries and check they load,
      # rebuilding from source only if they do not. Seconds on a healthy platform, a
      # repair on a broken one, and no edit needed when CRAN catches up -- or if some
      # other platform breaks next time. Delete the step once it has been a no-op
      # everywhere for a while.
      - name: Ensure stringfish/qs2 load against the installed RcppParallel
        run: |
          install.packages("RcppParallel")
          install.packages(c("stringfish", "qs2"))
          if (!requireNamespace("qs2", quietly = TRUE)) {
            message("qs2 does not load -- rebuilding it and stringfish from source")
            install.packages(c("stringfish", "qs2"), type = "source")
          }
          library(qs2)  # fail here, not 20 minutes later inside R CMD check
        shell: Rscript {0}

      # cache-version 4 forces a cold resolve against post-RcppParallel-6.2.0 CRAN
      # (6.2.0 landed 2026-07-30; the v3 caches were built 2026-07-29 against 6.1.x).
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 4
          extra-packages: any::rcmdcheck
          needs: check

      # rxode2 links RcppParallel's TBB, so it must be loadable against whichever
      # RcppParallel the resolver installed -- and right now it is not, on Windows.
      # RcppParallel 6.2.0 (Windows binary 2026-08-01) moved Windows from a static
      # TBB to a shipped shared tbb.dll and removed the compatibility stub, while
      # CRAN still serves the rxode2 5.1.5 Windows binary built 2026-07-30 against
      # the previous generation, so rxode2.dll imports a procedure that no longer
      # exists. Each package is individually fine; only the COMBINATION is broken,
      # which is why a dated snapshot is the right shape of fix -- and a Windows
      # source build of rxode2 against 6.2.0 does not link (nlmixr2est hit that).
      #
      # DETECT and REPAIR are separate steps on purpose. Merely testing whether
      # rxode2 loads pulls RcppParallel's DLL into the session, and Windows will
      # not overwrite a loaded DLL -- doing both in one step fails with "cannot
      # remove prior installation of package 'RcppParallel'". Each `Rscript {0}`
      # step is a fresh R process, so the lock is gone by the time we install.
      #
      # Conditional, so it costs one requireNamespace() on a healthy platform and
      # removes itself once CRAN rebuilds the rxode2 binary -- same shape as the
      # stringfish/qs2 guard above. Delete both once they are no-ops everywhere.
      - name: Detect whether rxode2 loads against the installed RcppParallel
        id: rxode2-load
        run: |
          .ok <- requireNamespace("rxode2", quietly = TRUE)
          cat(paste0("needs_pin=", if (.ok) "false" else "true"),
              file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE, fill = TRUE)
        shell: Rscript {0}

      - name: Pin RcppParallel to a consistent snapshot if it does not
        if: steps.rxode2-load.outputs.needs_pin == 'true'
        run: |
          message("rxode2 does not load -- pinning RcppParallel to the snapshot ",
                  "its binary was built against")
          install.packages("RcppParallel",
                           repos = "https://packagemanager.posit.co/cran/2026-07-31")
        shell: Rscript {0}

      - name: Confirm rxode2 loads
        run: library(rxode2)   # fail here, with this message, not later and opaquely
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        env:
          # Run the integration suite everywhere EXCEPT ubuntu-devel.
          #
          # These tests are all skip_on_cran()'d, so CRAN itself never runs them;
          # NOT_CRAN = "true" is what forces them on under rcmdcheck. On devel they
          # accumulate ~1 GB+ of unreclaimable native memory (see MALLOC_ARENA_MAX
          # above) and the job is SIGTERM'd mid-`checking tests` -- kill times vary
          # (30-44 min) and devel PASSES on main at 42-69 min, so it is a memory
          # ceiling, not a timeout and not a hang.
          #
          # No coverage is lost: the compat-oldstack job already runs the full
          # integration suite on ubuntu in ~8 min. The devel entry exists to check
          # R-devel compliance, which is exactly what remains.
          NOT_CRAN: ${{ matrix.config.r == 'devel' && 'false' || 'true' }}
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--no-build-vignettes")'
          args: 'c("--no-manual", "--ignore-vignettes", "--as-cran")'
